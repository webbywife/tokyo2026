<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tokyo 2026 — Trip Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="trip-places.js"></script>
<script src="trip-data.js"></script>
<script src="app/exclusion.js"></script>
<script src="app/store.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --panel:#FBF7F3;
    --panel-2:#F1E4DE;
    --text:#2A2622;
    --text-dim:#6E625A;
    --line: rgba(42,38,34,0.12);
    --d1:#C0362C;
    --d2:#A8641C;
    --d3:#2E7D4F;
    --d4:#6B4FB0;
    --dr:#6E6A66;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    color:var(--text);
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(circle at 8% 0%, rgba(192,54,44,0.06), transparent 45%),
      var(--bg);
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.16em;
    color:var(--d1);
    text-transform:uppercase;
    margin-bottom:6px;
    font-weight:500;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:24px;
    margin:0 0 12px;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--d1);}

  .back-link{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:500;
    color:var(--text);
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
    margin-bottom:12px;
  }
  .back-link:hover{background:var(--panel-2);}

  .filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .filter-btn{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px 7px 10px;
    cursor:pointer;
    transition:opacity 0.15s ease;
  }
  .filter-btn .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .filter-btn .dot:not(:empty){
    width:16px; height:16px; display:flex; align-items:center; justify-content:center;
    font-size:9px; line-height:1;
  }
  .filter-btn.off{opacity:0.35;}
  .filter-btn.is-mode{border-color:var(--d1); color:var(--d1);}
  .filter-btn:hover{opacity:0.75;}
  .filter-btn.off:hover{opacity:0.55;}

  #map{flex:1; min-height:0; position:relative;}

  /* Full screen, matching the per-day maps in itinerary.html. Same CSS-overlay
   * approach rather than the Fullscreen API, because iOS Safari won't take a
   * <div> fullscreen. The title block goes, the day filters stay — they're the
   * map's controls, and losing them mid-trip would be worse than the space. */
  .map-fs-btn{
    position:absolute; top:10px; right:10px; z-index:1003;
    width:34px; height:34px; padding:0;
    display:flex; align-items:center; justify-content:center;
    font:600 15px/1 'Inter', sans-serif; color:var(--text);
    background:rgba(255,255,255,0.94);
    border:1px solid var(--line); border-radius:9px;
    box-shadow:0 1px 5px rgba(42,38,34,0.28);
    cursor:pointer;
  }
  .map-fs-btn:hover{background:#fff;}
  body.map-fullscreen .back-link,
  body.map-fullscreen .eyebrow,
  body.map-fullscreen h1{display:none;}
  /* Taking the header out of flow is what makes the map actually fill the screen:
   * eight filter buttons wrap to ~230px on a phone, a third of the viewport. It
   * slides back in over the map on demand instead of permanently costing that. */
  body.map-fullscreen header{
    position:absolute; top:0; left:0; right:0; z-index:1002;
    padding:62px 10px 12px; border-bottom:1px solid var(--line);
    background:rgba(255,255,255,0.96);
    max-height:70vh; overflow-y:auto;
    transform:translateY(-101%);
    transition:transform 0.18s ease;
  }
  body.map-fullscreen.filters-open header{transform:none;}
  /* the zoom control ghosts through the translucent sheet otherwise */
  body.map-fullscreen.filters-open .leaflet-control-zoom{visibility:hidden;}
  body.map-fullscreen .map-fs-btn{top:14px; right:14px; width:40px; height:40px; font-size:17px;}
  .map-layers-btn{display:none;}
  body.map-fullscreen .map-layers-btn{
    display:flex; top:14px; right:62px; width:40px; height:40px; font-size:16px;
  }
  body.map-fullscreen.filters-open .map-layers-btn{background:var(--panel-2);}

  .leaflet-popup-content-wrapper{
    background:var(--panel);
    border-radius:12px;
    box-shadow:0 4px 18px rgba(42,38,34,0.15);
    padding:0;
    overflow:hidden;
  }
  .leaflet-popup-content{margin:0; width:240px !important;}
  .leaflet-popup-tip{background:var(--panel);}
  .popup-photo{
    width:100%;
    height:130px;
    object-fit:cover;
    display:block;
  }
  .popup-body{padding:12px 14px 14px;}
  .popup-day{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-bottom:3px;
    font-weight:600;
  }
  .popup-time{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:2px;
  }
  .popup-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    margin-bottom:4px;
  }
  .popup-note{
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .popup-transport{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--text);
    line-height:1.5;
  }
  .transport-label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--d1);
    margin-bottom:2px;
    font-weight:600;
  }
  .sv-link{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:var(--text);
    text-decoration:none;
    background:var(--panel-2);
    border-radius:8px;
    padding:7px 10px;
  }
  .sv-link:hover{background:var(--line);}

  .pin{
    width:16px;
    height:16px;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
  }

  .pin-circle{
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    line-height:1;
  }

  @media (max-width:640px){
    h1{font-size:20px;}
    .filter-btn{font-size:12px; padding:6px 11px 6px 8px;}
  }
</style>
</head>
<body>

<header>
  <a class="back-link" href="itinerary.html">← Back to itinerary</a>
  <div class="eyebrow">Tokyo 2026 · day-trips map</div>
  <h1>Four trips, <span>one map</span></h1>
  <div class="filters" id="filters"></div>
</header>

<div id="map"></div>

<script>
  const days = {
    1: { label: "Day 1 · Thu 10 — Chōfu & Shinjuku", color: "#C0362C" },
    2: { label: "Day 2 · Fri 11 — Okutama",  color: "#A8641C" },
    3: { label: "Day 3 · Sat 12 — Mito coast", color: "#2E7D4F" },
    4: { label: "Day 4 · Sun 13 — Kamakura", color: "#6B4FB0" },
    5: { label: "Rain plan — in Tokyo",      color: "#6E6A66" },
    6: { label: "Quieter picks & swaps",     color: "#3F7E7E" },
  };

  const places = window.TRIP_PLACES || [];

  // Home base — every day starts and ends here, so "how do I get there" means
  // "from the hotel" on a map with no running order.
  const HOME = places.find(p => /Gracery/.test(p.name)) || { lat: 35.69556, lon: 139.70228 };
  const transitUrl = (from, to) =>
    `https://www.google.com/maps/dir/?api=1&origin=${from.lat},${from.lon}` +
    `&destination=${to.lat},${to.lon}&travelmode=transit`;
  const transitLink = to => to === HOME ? '' :
    `<a class="sv-link" href="${transitUrl(HOME, to)}" target="_blank" rel="noopener">🚉 Transit from the hotel ↗</a>`;

  const transitPlaces = [
    { kind:"rail", name:"Shinjuku Station", lat:35.69003, lon:139.70047, note:"JR Shōnan–Shinjuku Line to Yokohama & Kamakura; Odakyū Romancecar to Hakone & Enoshima; the Sightseeing Center sells the passes" },
    { kind:"bus",  name:"Busta Shinjuku", lat:35.68660, lon:139.70027, note:"Expressway bus terminal above the station — Airport Limousine Bus to/from Haneda" },
    { kind:"rail", name:"Tōbu Asakusa Station", lat:35.71070, lon:139.79800, note:"Tōbu Limited Express SPACIA to Nikkō — the fastest, most frequent route" },
    { kind:"rail", name:"Shinagawa Station", lat:35.62855, lon:139.73876, note:"JR + Keikyū — transfer to the Keikyū line for Haneda (runs later than the buses)" },
    { kind:"rail", name:"Yokohama Station", lat:35.46570, lon:139.62220, note:"JR / Tōkyū / Minatomirai lines — ~30 min from Shinjuku" },
    { kind:"rail", name:"Ōfuna Station", lat:35.35360, lon:139.53200, note:"Junction for the JR line into Kamakura and the Shōnan Monorail" },
    { kind:"rail", name:"Odawara Station", lat:35.25600, lon:139.15530, note:"Odakyū + JR + Tōkaidō Shinkansen — fallback into Hakone if the Romancecar is booked out" },
    { kind:"rail", name:"Katase-Enoshima Station", lat:35.30640, lon:139.48280, note:"Odakyū terminus — direct 'Enoshima' Romancecar back to Shinjuku" },
    { kind:"rail", name:"Toyosu Station", lat:35.65460, lon:139.79670, note:"Yūrakuchō line + Yurikamome — nearest to teamLab Planets" },
  ];

  const transitTypes = {
    rail: { label: "Train / Line",  color: "#1565C0", emoji: "🚉" },
    bus:  { label: "Airport bus",   color: "#E65100", emoji: "🚌" },
  };

  const map = L.map('map', { zoomControl: true }).setView([35.9, 139.3], 8);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  function makeIcon(color){
    return L.divIcon({
      className: '',
      html: `<div class="pin" style="background:${color}"></div>`,
      iconSize: [16,16],
      iconAnchor: [8,14],
      popupAnchor: [0,-14]
    });
  }

  function makeCircleIcon(color, emoji, size){
    size = size || 22;
    return L.divIcon({
      className: '',
      html: `<div class="pin-circle" style="background:${color}">${emoji}</div>`,
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
      popupAnchor: [0, -size/2]
    });
  }

  const OFF_BY_DEFAULT = new Set(['6']); // "Quieter picks" starts hidden to keep the map readable

  const dayLayers = {};
  Object.keys(days).forEach(d => {
    dayLayers[d] = L.layerGroup();
    if (!OFF_BY_DEFAULT.has(String(d))) dayLayers[d].addTo(map);
  });

  /* ---------- which pins belong to a choice we actually made ----------
   * A pin tagged with a `group` belongs to one of the option cards. It draws
   * only when that option is the current pick, so the map shows the trip you
   * chose rather than every alternative at once. Untagged pins are fixed stops
   * and always draw. If the data or the engine is missing we fall back to
   * showing everything — the map must never come up empty.
   */
  let showAll = false;

  function pickedGroups() {
    if (showAll) return null;
    const slots = window.TRIP_SLOTS || [];
    if (!slots.length || !window.Exclusion) return null;
    const choices = window.TripStore ? window.TripStore.choices() : {};
    const picked = {};
    try {
      window.Exclusion.resolve(slots, choices).forEach(slot => {
        slot.options.forEach(o => {
          if (!o.isPicked) return;
          if (o.group) picked[o.group] = true;
          (o.alsoConsumes || []).forEach(g => { picked[g] = true; });
        });
      });
    } catch (e) { console.error('[map] exclusion failed, showing every pin', e); return null; }
    return picked;
  }

  const isVisible = (p, picked) => !picked || !p.group || !!picked[p.group];

  function markerFor(p) {
    const color = days[p.day].color;
    const icon = p.shop ? makeCircleIcon(color, '🛍️', 20) : makeIcon(color);
    const marker = L.marker([p.lat, p.lon], { icon });
    const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lon}`;
    marker.bindPopup(
      (p.photo ? `<img class="popup-photo" src="${p.photo}" alt="${p.name}" loading="lazy">` : '') +
      `<div class="popup-body">` +
      `<div class="popup-day" style="color:${color}">${days[p.day].label}${p.shop ? ' · 🛍️ Shopping' : ''}</div>` +
      `<div class="popup-time">${p.time === 'pick' ? 'Your pick' : p.time}</div>` +
      `<div class="popup-name">${p.name}</div>` +
      `<div class="popup-note">${p.note}</div>` +
      (p.transport ? `<div class="popup-transport"><span class="transport-label">Getting there</span>${p.transport}</div>` : '') +
      transitLink(p) +
      `<a class="sv-link" href="${streetViewUrl}" target="_blank" rel="noopener">📷 Open in Street View ↗</a>` +
      `</div>`,
      { maxWidth: 260 }
    );
    return marker;
  }

  /* Layer groups are created once and only ever emptied and refilled, so the
   * day filter toggles keep their state across a re-render. */
  function renderPins() {
    const picked = pickedGroups();
    Object.keys(dayLayers).forEach(d => dayLayers[d].clearLayers());
    let shown = 0;
    places.forEach(p => {
      if (!isVisible(p, picked)) return;
      markerFor(p).addTo(dayLayers[p.day]);
      shown++;
    });
    return shown;
  }
  renderPins();

  const transitLayers = {};
  Object.keys(transitTypes).forEach(k => transitLayers[k] = L.layerGroup().addTo(map));

  transitPlaces.forEach(p => {
    const info = transitTypes[p.kind];
    const marker = L.marker([p.lat, p.lon], { icon: makeCircleIcon(info.color, info.emoji, 20) });
    const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lon}`;
    marker.bindPopup(
      `<div class="popup-body">` +
      `<div class="popup-day" style="color:${info.color}">${info.emoji} ${info.label}</div>` +
      `<div class="popup-name">${p.name}</div>` +
      `<div class="popup-note">${p.note}</div>` +
      transitLink(p) +
      `<a class="sv-link" href="${streetViewUrl}" target="_blank" rel="noopener">📷 Open in Street View ↗</a>` +
      `</div>`,
      { maxWidth: 260 }
    );
    marker.addTo(transitLayers[p.kind]);
  });

  // Filter buttons
  const filtersEl = document.getElementById('filters');
  const activeDays = new Set(Object.keys(days).map(Number).filter(d => !OFF_BY_DEFAULT.has(String(d))));

  Object.entries(days).forEach(([d, info]) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (OFF_BY_DEFAULT.has(String(d)) ? ' off' : '');
    btn.innerHTML = `<span class="dot" style="background:${info.color}"></span>${info.label}`;
    btn.addEventListener('click', () => {
      const dayNum = Number(d);
      if (activeDays.has(dayNum)) {
        activeDays.delete(dayNum);
        map.removeLayer(dayLayers[d]);
        btn.classList.add('off');
      } else {
        activeDays.add(dayNum);
        map.addLayer(dayLayers[d]);
        btn.classList.remove('off');
      }
    });
    filtersEl.appendChild(btn);
  });

  const activeTransit = new Set(Object.keys(transitTypes));

  Object.entries(transitTypes).forEach(([k, info]) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.innerHTML = `<span class="dot" style="background:${info.color}">${info.emoji}</span>${info.label}`;
    btn.addEventListener('click', () => {
      if (activeTransit.has(k)) {
        activeTransit.delete(k);
        map.removeLayer(transitLayers[k]);
        btn.classList.add('off');
      } else {
        activeTransit.add(k);
        map.addLayer(transitLayers[k]);
        btn.classList.remove('off');
      }
    });
    filtersEl.appendChild(btn);
  });

  /* An escape hatch back to the old behaviour: filtering by picks hides the
   * alternatives, but "what else is near Day 3" is a real reason to open this
   * map, so keep one tap away. */
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn off is-mode';
  allBtn.innerHTML = `<span class="dot" style="background:#C0362C"></span>All options`;
  allBtn.title = 'Show every alternative, not just what you picked';
  allBtn.addEventListener('click', () => {
    showAll = !showAll;
    allBtn.classList.toggle('off', !showAll);
    allBtn.title = showAll ? 'Show only what you picked' : 'Show every alternative, not just what you picked';
    renderPins();
  });
  filtersEl.appendChild(allBtn);

  // Fit bounds to what is actually drawn (skip the hidden "Quieter picks" layer
  // so the view stays tight).
  const shownLatLngs = places
    .filter(p => p.day !== 6 && isVisible(p, pickedGroups()))
    .map(p => [p.lat, p.lon]);
  if (shownLatLngs.length) map.fitBounds(shownLatLngs, { padding: [30,30] });

  /* Same shared store the itinerary writes to, so a pick made on one phone
   * redraws this map on the other within a poll — and instantly in the tab next
   * door, since both read the same localStorage. Bounds are deliberately not
   * refitted on update: yanking the view out from under someone mid-pan is
   * worse than a slightly off-centre map. */
  if (window.TripStore) {
    window.TripStore.onChange(renderPins);
    window.TripStore.start();
  }

  // Full screen — the header costs real height on a phone, where a wrapping row
  // of eight filter buttons can take a third of the screen.
  const fsBtn = document.createElement('button');
  fsBtn.type = 'button';
  fsBtn.className = 'map-fs-btn';
  fsBtn.textContent = '⤢';
  fsBtn.title = 'Expand map';
  fsBtn.setAttribute('aria-label', 'Expand map to full screen');
  // Leaflet swallows clicks on anything over the map unless told not to.
  L.DomEvent.disableClickPropagation(fsBtn);
  L.DomEvent.disableScrollPropagation(fsBtn);
  document.getElementById('map').appendChild(fsBtn);

  // In full screen the filters slide in over the map instead of holding a third
  // of the viewport open permanently.
  const layersBtn = document.createElement('button');
  layersBtn.type = 'button';
  layersBtn.className = 'map-fs-btn map-layers-btn';
  layersBtn.textContent = '☰';
  layersBtn.title = 'Filters';
  layersBtn.setAttribute('aria-label', 'Show map filters');
  L.DomEvent.disableClickPropagation(layersBtn);
  L.DomEvent.disableScrollPropagation(layersBtn);
  document.getElementById('map').appendChild(layersBtn);

  layersBtn.addEventListener('click', ev => {
    ev.preventDefault(); ev.stopPropagation();
    const open = document.body.classList.toggle('filters-open');
    layersBtn.setAttribute('aria-label', open ? 'Hide map filters' : 'Show map filters');
  });

  function setMapFullscreen(on){
    document.body.classList.toggle('map-fullscreen', on);
    if (!on) document.body.classList.remove('filters-open');   // don't leave it armed
    fsBtn.textContent = on ? '✕' : '⤢';
    fsBtn.title = on ? 'Close full screen' : 'Expand map';
    fsBtn.setAttribute('aria-label', on ? 'Exit full screen' : 'Expand map to full screen');
    // Deliberately no refit: keep whatever the reader had panned or zoomed to,
    // and just give them more of it. Leaflet still has to re-measure.
    setTimeout(() => map.invalidateSize(), 60);
  }

  fsBtn.addEventListener('click', ev => {
    ev.preventDefault(); ev.stopPropagation();
    setMapFullscreen(!document.body.classList.contains('map-fullscreen'));
  });
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Escape' || !document.body.classList.contains('map-fullscreen')) return;
    if (document.body.classList.contains('filters-open')) document.body.classList.remove('filters-open');
    else setMapFullscreen(false);
  });
</script>
</body>
</html>
