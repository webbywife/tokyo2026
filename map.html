<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tokyo 2026 — Trip Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --panel:#FBF7F3;
    --panel-2:#F1E4DE;
    --text:#2A2622;
    --text-dim:#6E625A;
    --line: rgba(42,38,34,0.12);
    --d1:#C0362C;
    --d2:#A8641C;
    --d3:#2E7D4F;
    --d4:#6B4FB0;
    --dr:#6E6A66;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    color:var(--text);
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(circle at 8% 0%, rgba(192,54,44,0.06), transparent 45%),
      var(--bg);
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.16em;
    color:var(--d1);
    text-transform:uppercase;
    margin-bottom:6px;
    font-weight:500;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:24px;
    margin:0 0 12px;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--d1);}

  .back-link{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:500;
    color:var(--text);
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
    margin-bottom:12px;
  }
  .back-link:hover{background:var(--panel-2);}

  .filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .filter-btn{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px 7px 10px;
    cursor:pointer;
    transition:opacity 0.15s ease;
  }
  .filter-btn .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .filter-btn .dot:not(:empty){
    width:16px; height:16px; display:flex; align-items:center; justify-content:center;
    font-size:9px; line-height:1;
  }
  .filter-btn.off{opacity:0.35;}
  .filter-btn:hover{opacity:0.75;}
  .filter-btn.off:hover{opacity:0.55;}

  #map{flex:1; min-height:0;}

  .leaflet-popup-content-wrapper{
    background:var(--panel);
    border-radius:12px;
    box-shadow:0 4px 18px rgba(42,38,34,0.15);
    padding:0;
    overflow:hidden;
  }
  .leaflet-popup-content{margin:0; width:240px !important;}
  .leaflet-popup-tip{background:var(--panel);}
  .popup-photo{
    width:100%;
    height:130px;
    object-fit:cover;
    display:block;
  }
  .popup-body{padding:12px 14px 14px;}
  .popup-day{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-bottom:3px;
    font-weight:600;
  }
  .popup-time{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:2px;
  }
  .popup-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    margin-bottom:4px;
  }
  .popup-note{
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .popup-transport{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--text);
    line-height:1.5;
  }
  .transport-label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--d1);
    margin-bottom:2px;
    font-weight:600;
  }
  .sv-link{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:var(--text);
    text-decoration:none;
    background:var(--panel-2);
    border-radius:8px;
    padding:7px 10px;
  }
  .sv-link:hover{background:var(--line);}

  .pin{
    width:16px;
    height:16px;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
  }

  .pin-circle{
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    line-height:1;
  }

  @media (max-width:640px){
    h1{font-size:20px;}
    .filter-btn{font-size:12px; padding:6px 11px 6px 8px;}
  }
</style>
</head>

    { day:6, time:"swap", name:"Chichibu (Saitama)", lat:35.99900, lon:139.08550, note:"Seibu Laview express ~80 min from Ikebukuro. Nagatoro gorge boats, Chichibu Shrine, Hitsujiyama Park, sake breweries", transport:"Seibu-Chichibu Line" },
    { day:6, time:"swap", name:"Nagatoro gorge", lat:36.10900, lon:139.11300, note:"River-boat runs through the Iwadatami rock shelves + a steam-train line. Boats stop in high water", transport:"Chichibu Railway from Chichibu, ~15 min" },
    { day:6, time:"swap", name:"Okutama (west Tokyo)", lat:35.80930, lon:139.09660, note:"JR Ōme line ~2 h. Base for the Hatonosu gorge trail and Lake Okutama", transport:"JR Chūō + Ōme line" },
    { day:6, time:"swap", name:"Nippara Limestone Caves", lat:35.85600, lon:139.01700, note:"Big show-cave, 11 °C inside year-round — an all-weather and hot-day pick", transport:"bus ~30 min from Okutama Stn" },
    { day:6, time:"swap", name:"Sawara canal town (Chiba)", lat:35.89700, lon:140.49900, note:"'Little Edo of the East' — willow-lined merchant canal, boat rides, the Inō Tadataka museum. JR ~90 min", transport:"JR Narita line to Sawara" },
    { day:6, time:"swap", name:"Katori Jingū", lat:35.88400, lon:140.52800, note:"One of Japan's three great shrines — ancient, deep-forested, almost no tourists. Pair with Sawara", transport:"bus/taxi from Sawara Stn" },
    { day:6, time:"swap", name:"Mt Takao (Takaosanguchi)", lat:35.63200, lon:139.26900, note:"Keiō line ~50 min, ¥390. Cable car, a slope temple, easy hikes, Fuji from the top on a clear day", transport:"Keiō Takao line terminus" },
    { day:6, time:"swap", name:"Kawagoe — Kurazukuri street", lat:35.92500, lon:139.48500, note:"'Little Edo' — warehouse street, bell tower, candy alley, 540 stone rakan at Kita-in. ~40 min from Shinjuku", transport:"Tōbu Tōjō / Seibu Shinjuku / JR", shop:true },
    { day:6, time:"swap", name:"Nokogiriyama (Bōsō, Chiba)", lat:35.15900, lon:139.82900, note:"Ropeway to a cliff-edge 'Hell Lookout,' a 31 m hillside Buddha, 1,500 carved rakan — and empty. Ropeway stops in wind. Day 2 or 3 alternative", transport:"JR to Hamakanaya, or Tokyo-Bay ferry from Kurihama" },
    { day:6, time:"revisit", name:"Hakone — full Free Pass loop", lat:35.23283, lon:139.10694, note:"Switchback railway, Ōwakudani ropeway, Lake Ashi pirate ship, open-air museum, onsen — all on one ticket. Day 2 revisit card", transport:"Odakyū Romancecar from Shinjuku, ~85 min" },
    { day:6, time:"revisit", name:"Nikkō — shrines & Kegon Falls", lat:36.75810, lon:139.59890, note:"Tōshō-gū's carved mausoleum, Rinnō-ji's gold Buddhas, and a bus up the Irohazaka to Kegon Falls. Day 3 revisit card", transport:"Tōbu SPACIA from Asakusa, ~1h50" },
    { day:6, time:"swap", name:"Kairakuen, Mito (Ibaraki)", lat:36.37190, lon:140.45150, note:"One of Japan's three great gardens — uncrowded next to Kenrokuen. Limited express ~75 min from Ueno", transport:"JR Jōban line to Mito, then bus/walk" },
    { day:6, time:"swap", name:"Hitachi Seaside Park (Ibaraki)", lat:36.40170, lon:140.59100, note:"Kochia hills turn crimson from late September; big cycling park. Pairs with Mito", transport:"bus from Katsuta Stn" },
    { day:6, time:"swap", name:"Ōyama / Afuri Shrine (Isehara)", lat:35.44040, lon:139.24560, note:"Cable car to a mountain shrine and Ōyama-dera on a sacred hike — tofu country, almost no foreign tourists. Odakyū ~70 min + bus", transport:"Odakyū to Isehara, bus to the cable car" },
    { day:6, time:"add-on", name:"Morito Shrine, Hayama", lat:35.27080, lon:139.58430, note:"A red torii on an offshore rock, framed against Fuji at sunset — the quiet Shōnan version of the Hakone shot. Day 4 coast extension past Zushi", transport:"bus/train past Zushi, ~25 min beyond Kamakura" },
    { day:5, time:"any", name:"Todoroki Valley", lat:35.60640, lon:139.64350, note:"A 1 km wooded ravine with a stream and red bridges inside residential Setagaya — ends at a temple garden and tea house. Fair weather / light rain only", transport:"Tōkyū Ōimachi line, ~20 min from Shibuya" },
    { day:5, time:"any", name:"Shibamata", lat:35.76200, lon:139.87900, note:"Shōwa-era retro sweet-shop street to Taishakuten temple's carved wood panels + the Tora-san museum. Covered street, rain-OK", transport:"Keisei line via Takasago, ~40 min from Ueno" },
  ];

  const transitPlaces = [
    { kind:"rail", name:"Shinjuku Station", lat:35.69003, lon:139.70047, note:"JR Shōnan–Shinjuku Line to Yokohama & Kamakura; Odakyū Romancecar to Hakone & Enoshima; the Sightseeing Center sells the passes" },
    { kind:"bus",  name:"Busta Shinjuku", lat:35.68660, lon:139.70027, note:"Expressway bus terminal above the station — Airport Limousine Bus to/from Haneda" },
    { kind:"rail", name:"Tōbu Asakusa Station", lat:35.71070, lon:139.79800, note:"Tōbu Limited Express SPACIA to Nikkō — the fastest, most frequent route" },
    { kind:"rail", name:"Shinagawa Station", lat:35.62855, lon:139.73876, note:"JR + Keikyū — transfer to the Keikyū line for Haneda (runs later than the buses)" },
    { kind:"rail", name:"Yokohama Station", lat:35.46570, lon:139.62220, note:"JR / Tōkyū / Minatomirai lines — ~30 min from Shinjuku" },
    { kind:"rail", name:"Ōfuna Station", lat:35.35360, lon:139.53200, note:"Junction for the JR line into Kamakura and the Shōnan Monorail" },
    { kind:"rail", name:"Odawara Station", lat:35.25600, lon:139.15530, note:"Odakyū + JR + Tōkaidō Shinkansen — fallback into Hakone if the Romancecar is booked out" },
    { kind:"rail", name:"Katase-Enoshima Station", lat:35.30640, lon:139.48280, note:"Odakyū terminus — direct 'Enoshima' Romancecar back to Shinjuku" },
    { kind:"rail", name:"Toyosu Station", lat:35.65460, lon:139.79670, note:"Yūrakuchō line + Yurikamome — nearest to teamLab Planets" },
  ];

  const transitTypes = {
    rail: { label: "Train / Line",  color: "#1565C0", emoji: "🚉" },
    bus:  { label: "Airport bus",   color: "#E65100", emoji: "🚌" },
  };

  const map = L.map('map', { zoomControl: true }).setView([35.9, 139.3], 8);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  function makeIcon(color){
    return L.divIcon({
      className: '',
      html: `<div class="pin" style="background:${color}"></div>`,
      iconSize: [16,16],
      iconAnchor: [8,14],
      popupAnchor: [0,-14]
    });
  }

  function makeCircleIcon(color, emoji, size){
    size = size || 22;
    return L.divIcon({
      className: '',
      html: `<div class="pin-circle" style="background:${color}">${emoji}</div>`,
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
      popupAnchor: [0, -size/2]
    });
  }

  const OFF_BY_DEFAULT = new Set(['6']); // "Quieter picks" starts hidden to keep the map readable

  const dayLayers = {};
  Object.keys(days).forEach(d => {
    dayLayers[d] = L.layerGroup();
    if (!OFF_BY_DEFAULT.has(String(d))) dayLayers[d].addTo(map);
  });

  places.forEach(p => {
    const color = days[p.day].color;
    const icon = p.shop ? makeCircleIcon(color, '🛍️', 20) : makeIcon(color);
    const marker = L.marker([p.lat, p.lon], { icon });
    const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lon}`;
    marker.bindPopup(
      (p.photo ? `<img class="popup-photo" src="${p.photo}" alt="${p.name}" loading="lazy">` : '') +
      `<div class="popup-body">` +
      `<div class="popup-day" style="color:${color}">${days[p.day].label}${p.shop ? ' · 🛍️ Shopping' : ''}</div>` +
      `<div class="popup-time">${p.time}</div>` +
      `<div class="popup-name">${p.name}</div>` +
      `<div class="popup-note">${p.note}</div>` +
      (p.transport ? `<div class="popup-transport"><span class="transport-label">Getting there</span>${p.transport}</div>` : '') +
      `<a class="sv-link" href="${streetViewUrl}" target="_blank" rel="noopener">📷 Open in Street View ↗</a>` +
      `</div>`,
      { maxWidth: 260 }
    );
    marker.addTo(dayLayers[p.day]);
  });

  const transitLayers = {};
  Object.keys(transitTypes).forEach(k => transitLayers[k] = L.layerGroup().addTo(map));

  transitPlaces.forEach(p => {
    const info = transitTypes[p.kind];
    const marker = L.marker([p.lat, p.lon], { icon: makeCircleIcon(info.color, info.emoji, 20) });
    const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lon}`;
    marker.bindPopup(
      `<div class="popup-body">` +
      `<div class="popup-day" style="color:${info.color}">${info.emoji} ${info.label}</div>` +
      `<div class="popup-name">${p.name}</div>` +
      `<div class="popup-note">${p.note}</div>` +
      `<a class="sv-link" href="${streetViewUrl}" target="_blank" rel="noopener">📷 Open in Street View ↗</a>` +
      `</div>`,
      { maxWidth: 260 }
    );
    marker.addTo(transitLayers[p.kind]);
  });

  // Filter buttons
  const filtersEl = document.getElementById('filters');
  const activeDays = new Set(Object.keys(days).map(Number).filter(d => !OFF_BY_DEFAULT.has(String(d))));

  Object.entries(days).forEach(([d, info]) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (OFF_BY_DEFAULT.has(String(d)) ? ' off' : '');
    btn.innerHTML = `<span class="dot" style="background:${info.color}"></span>${info.label}`;
    btn.addEventListener('click', () => {
      const dayNum = Number(d);
      if (activeDays.has(dayNum)) {
        activeDays.delete(dayNum);
        map.removeLayer(dayLayers[d]);
        btn.classList.add('off');
      } else {
        activeDays.add(dayNum);
        map.addLayer(dayLayers[d]);
        btn.classList.remove('off');
      }
    });
    filtersEl.appendChild(btn);
  });

  const activeTransit = new Set(Object.keys(transitTypes));

  Object.entries(transitTypes).forEach(([k, info]) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.innerHTML = `<span class="dot" style="background:${info.color}">${info.emoji}</span>${info.label}`;
    btn.addEventListener('click', () => {
      if (activeTransit.has(k)) {
        activeTransit.delete(k);
        map.removeLayer(transitLayers[k]);
        btn.classList.add('off');
      } else {
        activeTransit.add(k);
        map.addLayer(transitLayers[k]);
        btn.classList.remove('off');
      }
    });
    filtersEl.appendChild(btn);
  });

  // Fit bounds to the scheduled trips (skip the hidden "Quieter picks" so the view stays tight)
  const allLatLngs = places.filter(p => p.day !== 6).map(p => [p.lat, p.lon]);
  map.fitBounds(allLatLngs, { padding: [30,30] });
</script>
</body>
</html>
