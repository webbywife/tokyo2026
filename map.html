<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tokyo 2026 — Trip Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#FFFFFF;
    --panel:#FBF7F3;
    --panel-2:#F1E4DE;
    --text:#2A2622;
    --text-dim:#6E625A;
    --line: rgba(42,38,34,0.12);
    --d1:#C0362C;
    --d2:#A8641C;
    --d3:#2E7D4F;
    --d4:#6B4FB0;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    color:var(--text);
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(circle at 8% 0%, rgba(192,54,44,0.06), transparent 45%),
      var(--bg);
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    letter-spacing:0.16em;
    color:var(--d1);
    text-transform:uppercase;
    margin-bottom:6px;
    font-weight:500;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:24px;
    margin:0 0 12px;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--d1);}

  .back-link{
    display:inline-block;
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:500;
    color:var(--text);
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
    margin-bottom:12px;
  }
  .back-link:hover{background:var(--panel-2);}

  .filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .filter-btn{
    display:flex;
    align-items:center;
    gap:7px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    color:var(--text);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:7px 14px 7px 10px;
    cursor:pointer;
    transition:opacity 0.15s ease;
  }
  .filter-btn .dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .filter-btn .dot:not(:empty){
    width:16px; height:16px; display:flex; align-items:center; justify-content:center;
    font-size:9px; line-height:1;
  }
  .filter-btn.off{opacity:0.35;}
  .filter-btn:hover{opacity:0.75;}
  .filter-btn.off:hover{opacity:0.55;}

  #map{flex:1; min-height:0;}

  .leaflet-popup-content-wrapper{
    background:var(--panel);
    border-radius:12px;
    box-shadow:0 4px 18px rgba(42,38,34,0.15);
    padding:0;
    overflow:hidden;
  }
  .leaflet-popup-content{margin:0; width:240px !important;}
  .leaflet-popup-tip{background:var(--panel);}
  .popup-photo{
    width:100%;
    height:130px;
    object-fit:cover;
    display:block;
  }
  .popup-body{padding:12px 14px 14px;}
  .popup-day{
    font-family:'JetBrains Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    margin-bottom:3px;
    font-weight:600;
  }
  .popup-time{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:2px;
  }
  .popup-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15px;
    margin-bottom:4px;
  }
  .popup-note{
    font-size:12.5px;
    color:var(--text-dim);
    line-height:1.5;
  }
  .popup-transport{
    margin-top:8px;
    padding-top:8px;
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--text);
    line-height:1.5;
  }
  .transport-label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--d1);
    margin-bottom:2px;
    font-weight:600;
  }
  .sv-link{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:var(--text);
    text-decoration:none;
    background:var(--panel-2);
    border-radius:8px;
    padding:7px 10px;
  }
  .sv-link:hover{background:var(--line);}

  .pin{
    width:16px;
    height:16px;
    border-radius:50% 50% 50% 0;
    transform:rotate(-45deg);
    border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
  }

  .pin-circle{
    width:20px;
    height:20px;
    border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.35);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    line-height:1;
  }

  @media (max-width:640px){
    h1{font-size:20px;}
    .filter-btn{font-size:12px; padding:6px 11px 6px 8px;}
  }
</style>
</head>
<body>

<header>
  <a class="back-link" href="itinerary.html">← Back to itinerary</a>
  <div class="eyebrow">Tokyo 2026 · full trip map</div>
  <h1>Every stop, <span>one map</span></h1>
  <div class="filters" id="filters"></div>
</header>

<div id="map"></div>

<script>
  const days = {
    1: { label: "Day 1 · Thu 10", color: "#C0362C" },
    2: { label: "Day 2 · Fri 11", color: "#A8641C" },
    3: { label: "Day 3 · Sat 12", color: "#2E7D4F" },
    4: { label: "Day 4 · Sun 13", color: "#6B4FB0" },
  };

  const places = [
    // Day 1 — Touchdown & slow Shinjuku
    { day:1, time:"04:45", name:"Haneda Airport, Terminal 3", lat:35.54936, lon:139.77991, note:"Arrival point — red-eye from Manila", transport:"Airport Limousine Bus to Busta Shinjuku · ~35–50 min, ¥1,400", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/All_haneda.jpg/1280px-All_haneda.jpg" },
    { day:1, time:"06:15", name:"Odakyu Hotel Century Southern Tower", lat:35.68580, lon:139.70090, note:"Home base, all 3 nights — above Shinjuku Station South Exit", transport:"Steps from the Busta Shinjuku bus arrival; Odakyu line downstairs is the Hakone train" },
    { day:1, time:"09:00", name:"Shinjuku Gyoen National Garden", lat:35.68516, lon:139.71000, note:"Slow morning — lawns, greenhouse, French garden. ¥500", transport:"~10-min walk from the hotel" },
    { day:1, time:"11:00", name:"Meiji Jingu", lat:35.67637, lon:139.69932, note:"Forest shrine, giant torii, sake-barrel wall. Free", transport:"JR to Harajuku, ~5 min", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Meiji_Jingu_2023-3.jpg/1280px-Meiji_Jingu_2023-3.jpg" },
    { day:1, time:"12:15", name:"Harajuku & Omotesandō", lat:35.66896, lon:139.70598, note:"Lunch + stroll — Ura-Hara backstreets, Omotesandō flagships, Takeshita Street", transport:"walk from Meiji Jingu's south exit", shop:true, photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/JRE-Harajuku-Station-07.jpg/1280px-JRE-Harajuku-Station-07.jpg" },
    { day:1, time:"20:00", name:"Tokyo Metropolitan Government Building", lat:35.68955, lon:139.69171, note:"Free observation deck, 45F ~202 m — open till ~22:00", transport:"~10-min walk from the hotel", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Tokyo_Metropolitan_Government_Building_2024.jpg/1280px-Tokyo_Metropolitan_Government_Building_2024.jpg" },
    { day:1, time:"18:30", name:"Omoide Yokochō", lat:35.69306, lon:139.69953, note:"Dinner — lantern-lit yakitori counters under the tracks", transport:"~6-min walk, west of Shinjuku Station" },
    { day:1, time:"21:00", name:"Golden Gai / Kabukichō", lat:35.69395, lon:139.70475, note:"Optional nightcap — tiny themed bars, atmospheric walk-through", transport:"~8-min walk, north-east of the station", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8d/G2_Street_20090626_2.jpg/1280px-G2_Street_20090626_2.jpg" },

    // Day 2 — Old Tokyo
    { day:2, time:"09:00", name:"Sensō-ji & Kaminarimon", lat:35.71476, lon:139.79665, note:"Tokyo's oldest temple (645) + Nakamise-dōri stalls. Free", transport:"Marunouchi → Ginza line, ~35 min from Shinjuku", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Sensoji_2023.jpg/1280px-Sensoji_2023.jpg" },
    { day:2, time:"10:45", name:"Tokyo Skytree", lat:35.71010, lon:139.81069, note:"Tembo Deck 350 m (~¥2,400), or free Solamachi rooftop garden", transport:"~20-min walk across Sumida Park", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/84/Tokyo_Skytree_2014_%E2%85%A2.jpg/1280px-Tokyo_Skytree_2014_%E2%85%A2.jpg" },
    { day:2, time:"14:20", name:"Ueno Park", lat:35.71542, lon:139.77320, note:"Pick one: Tokyo National Museum (¥1,000), Ueno Zoo (¥600), or just Shinobazu Pond", transport:"Ginza line, Asakusa → Ueno, ~5 min", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/18/Ueno_park.jpg/1280px-Ueno_park.jpg" },
    { day:2, time:"14:20", name:"Tokyo National Museum", lat:35.71879, lon:139.77650, note:"Samurai armour, swords, screens, Buddhist sculpture — Honkan highlights, ~90 min", transport:"north end of Ueno Park", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Tokyo_National_Museum%2C_Honkan_2010.jpg/1280px-Tokyo_National_Museum%2C_Honkan_2010.jpg" },
    { day:2, time:"16:00", name:"Ameyoko Market", lat:35.70889, lon:139.77451, note:"~400 stalls under the JR tracks — snacks, sneakers, seafood, standing bars", transport:"walk south through Ueno Park", shop:true, photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Ueno_20241210_133139.jpg/1280px-Ueno_20241210_133139.jpg" },
    { day:2, time:"17:30", name:"Akihabara Electric Town", lat:35.69836, lon:139.77313, note:"Arcades, Super Potato retro games, Mandarake, gachapon halls, themed cafés", transport:"1 JR stop from Okachimachi, or 8-min walk", shop:true, photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/6/60/Sotokanda%2C_Akihabara_Electric_Town_at_night_20231114.png/1280px-Sotokanda%2C_Akihabara_Electric_Town_at_night_20231114.png" },
    { day:2, time:"19:00", name:"Kanda railway-arch izakaya", lat:35.69171, lon:139.77086, note:"Dinner — grilled skewers and highballs under the tracks toward Kanda", transport:"~8-min walk south from Akihabara" },

    // Day 3 — Hakone loop
    { day:3, time:"07:30", name:"Odakyu Sightseeing Service Center, Shinjuku", lat:35.69073, lon:139.69966, note:"Buy the Hakone Free Pass (¥6,100, 2-day) + reserve the Romancecar", transport:"ground floor, Shinjuku West", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/b/bd/Odakyu-Type60000-MSE-Hakone.jpg/1280px-Odakyu-Type60000-MSE-Hakone.jpg" },
    { day:3, time:"09:15", name:"Hakone-Yumoto Station", lat:35.23283, lon:139.10694, note:"Gateway to the loop — switch to the Hakone Tozan mountain railway", transport:"Odakyu Romancecar from Shinjuku, ~85 min (+¥1,200 surcharge)" },
    { day:3, time:"10:15", name:"Hakone Open-Air Museum", lat:35.24466, lon:139.05617, note:"Henry Moore & Miró sculpture on the hillside, Picasso pavilion, hot-spring foot bath. ~¥1,800 w/ pass", transport:"Chōkoku-no-Mori stn, one stop below Gōra", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/91/Hakone5.jpg/1280px-Hakone5.jpg" },
    { day:3, time:"12:45", name:"Ōwakudani", lat:35.24466, lon:139.01972, note:"Ropeway over a live volcanic valley — sulphur vents, Fuji ahead, black eggs (¥500/5)", transport:"Sōunzan funicular → Hakone Ropeway", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/Owakudani_-_Hakone_%2827369344357%29.jpg/1280px-Owakudani_-_Hakone_%2827369344357%29.jpg" },
    { day:3, time:"14:15", name:"Lake Ashi — pirate-ship cruise", lat:35.21890, lon:139.01580, note:"Mock-galleon sightseeing boat across the lake, ~30 min, Fuji off the bow", transport:"Ropeway down to Tōgendai pier", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/2/23/260505_Moto-Hakone_Hakone_Japan01s3.jpg/1280px-260505_Moto-Hakone_Hakone_Japan01s3.jpg" },
    { day:3, time:"15:00", name:"Hakone Shrine — torii in the water", lat:35.20431, lon:139.02581, note:"The red Torii of Peace standing in Lake Ashi. Free (expect a photo queue on Saturday)", transport:"walk from Moto-Hakone pier", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Hakonejinja_-01.jpg/1280px-Hakonejinja_-01.jpg" },
    { day:3, time:"16:15", name:"Hakone Yuryō (onsen)", lat:35.23600, lon:139.10300, note:"Optional — reservable private open-air baths near Yumoto (~¥3,500)", transport:"free shuttle from Hakone-Yumoto Station" },

    // Day 4 — Shibuya, teamLab & the late flight
    { day:4, time:"10:30", name:"Shibuya Scramble Crossing", lat:35.65950, lon:139.70046, note:"The crossing + Hachikō statue — view it from the Tsutaya 2F window or Mag's Park rooftop", transport:"JR Yamanote, 3 min from Shinjuku", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/8/88/Shibuya_Crossing%2C_Aerial.jpg/1280px-Shibuya_Crossing%2C_Aerial.jpg" },
    { day:4, time:"11:00", name:"Shibuya Sky", lat:35.65803, lon:139.70160, note:"Open-air rooftop deck, ~229 m, straight down the crossing. ~¥2,700, timed entry", transport:"top of Shibuya Scramble Square, on the station", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/45/SHIBUYA_SCRAMBLE_SQUARE_East_Tower.jpg/1280px-SHIBUYA_SCRAMBLE_SQUARE_East_Tower.jpg" },
    { day:4, time:"13:30", name:"teamLab Planets, Toyosu", lat:35.64974, lon:139.79061, note:"Barefoot, wade-through digital-art rooms. ¥3,800, pre-booked slot, open late", transport:"~30 min from Shibuya via Yūrakuchō line + Yurikamome" },
    { day:4, time:"13:30", name:"Shimokitazawa", lat:35.66131, lon:139.66801, note:"Alt afternoon — secondhand shops, record stores, tiny cafés", transport:"1 stop from Shibuya on the Keiō Inokashira line", shop:true, photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/59/Shimokitazawa_Street_2015.jpg/1280px-Shimokitazawa_Street_2015.jpg" },
    { day:4, time:"13:30", name:"Odaiba", lat:35.62513, lon:139.77577, note:"Alt afternoon — Yurikamome over the Rainbow Bridge, life-size Gundam, bay views", transport:"Yurikamome from Shimbashi", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Odaiba_close_up_-_2025_Jan_14_01-27PM.jpeg/1280px-Odaiba_close_up_-_2025_Jan_14_01-27PM.jpeg" },
    { day:4, time:"16:30", name:"Ginza", lat:35.67169, lon:139.76490, note:"Souvenirs — Uniqlo/GU flagships, Itōya stationery, Mitsukoshi depachika food hall", transport:"~10 min from Shibuya on the Ginza line", shop:true, photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5b/Ginza-WAKO_at_night.jpg/1280px-Ginza-WAKO_at_night.jpg" },
    { day:4, time:"16:30", name:"Nakameguro / Daikanyama", lat:35.64400, lon:139.69870, note:"Souvenirs, calmer — canal-side design shops, Daikanyama T-Site bookstore", transport:"~7 min from Shibuya on the Tōkyū Tōyoko line", shop:true },
    { day:4, time:"20:45", name:"Haneda Airport, Terminal 3", lat:35.54936, lon:139.77991, note:"Departure — PR 422, 01:00, back to NAIA T1", transport:"Airport Limousine Bus from Busta Shinjuku, ~45–60 min (last runs ~22:00–22:30)", photo:"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7d/All_haneda.jpg/1280px-All_haneda.jpg" },
  ];

  const transitPlaces = [
    { kind:"subway", name:"Shinjuku Station", lat:35.69003, lon:139.70047, note:"JR / Odakyu / Keiō / Metro hub — Odakyu Romancecar to Hakone, JR Yamanote everywhere" },
    { kind:"bus",    name:"Busta Shinjuku", lat:35.68660, lon:139.70027, note:"Expressway bus terminal above the station — Airport Limousine Bus to/from Haneda" },
    { kind:"subway", name:"Harajuku / Meiji-jingūmae", lat:35.67020, lon:139.70270, note:"JR + Chiyoda/Fukutoshin lines — for Meiji Jingu, Takeshita St, Omotesandō" },
    { kind:"subway", name:"Asakusa Station", lat:35.71100, lon:139.79800, note:"Ginza / Toei Asakusa / Tōbu lines — 2-min walk to Kaminarimon" },
    { kind:"subway", name:"Tokyo Skytree / Oshiage", lat:35.71061, lon:139.81350, note:"Hanzōmon / Toei / Tōbu lines — under Skytree and Solamachi" },
    { kind:"subway", name:"Ueno Station", lat:35.71410, lon:139.77740, note:"JR + Ginza + Hibiya lines — Ueno Park, Ameyoko, museums" },
    { kind:"subway", name:"Akihabara Station", lat:35.69836, lon:139.77313, note:"JR Yamanote / Sōbu + Hibiya line — Electric Town exit" },
    { kind:"subway", name:"Shibuya Station", lat:35.65803, lon:139.70160, note:"JR + Ginza/Hanzōmon/Fukutoshin + Tōkyū + Keiō — Scramble Square / Shibuya Sky on top" },
    { kind:"subway", name:"Shinagawa Station", lat:35.62855, lon:139.73876, note:"JR + Keikyū — transfer to the Keikyū line for Haneda (runs later than the buses)" },
    { kind:"subway", name:"Toyosu Station", lat:35.65460, lon:139.79670, note:"Yūrakuchō line + Yurikamome — nearest to teamLab Planets" },
    { kind:"subway", name:"Hakone-Yumoto Station", lat:35.23283, lon:139.10694, note:"End of the Odakyu line — start of the 8-mode Hakone transport loop" },
    { kind:"subway", name:"Odawara Station", lat:35.25600, lon:139.15530, note:"Odakyu + JR + Tōkaidō Shinkansen — transfer point if the Romancecar is booked out" },
  ];

  const transitTypes = {
    subway: { label: "Train / Subway", color: "#1565C0", emoji: "🚇" },
    bus:    { label: "Airport Bus",    color: "#E65100", emoji: "🚌" },
  };

  const map = L.map('map', { zoomControl: true }).setView([35.55, 139.30], 9);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  function makeIcon(color){
    return L.divIcon({
      className: '',
      html: `<div class="pin" style="background:${color}"></div>`,
      iconSize: [16,16],
      iconAnchor: [8,14],
      popupAnchor: [0,-14]
    });
  }

  function makeCircleIcon(color, emoji, size){
    size = size || 22;
    return L.divIcon({
      className: '',
      html: `<div class="pin-circle" style="background:${color}">${emoji}</div>`,
      iconSize: [size, size],
      iconAnchor: [size/2, size/2],
      popupAnchor: [0, -size/2]
    });
  }

  const dayLayers = {};
  Object.keys(days).forEach(d => dayLayers[d] = L.layerGroup().addTo(map));

  places.forEach(p => {
    const color = days[p.day].color;
    const icon = p.shop ? makeCircleIcon(color, '🛍️', 20) : makeIcon(color);
    const marker = L.marker([p.lat, p.lon], { icon });
    const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lon}`;
    marker.bindPopup(
      (p.photo ? `<img class="popup-photo" src="${p.photo}" alt="${p.name}" loading="lazy">` : '') +
      `<div class="popup-body">` +
      `<div class="popup-day" style="color:${color}">${days[p.day].label}${p.shop ? ' · 🛍️ Shopping' : ''}</div>` +
      `<div class="popup-time">${p.time}</div>` +
      `<div class="popup-name">${p.name}</div>` +
      `<div class="popup-note">${p.note}</div>` +
      (p.transport ? `<div class="popup-transport"><span class="transport-label">Getting there</span>${p.transport}</div>` : '') +
      `<a class="sv-link" href="${streetViewUrl}" target="_blank" rel="noopener">📷 Open in Street View ↗</a>` +
      `</div>`,
      { maxWidth: 260 }
    );
    marker.addTo(dayLayers[p.day]);
  });

  const transitLayers = {};
  Object.keys(transitTypes).forEach(k => transitLayers[k] = L.layerGroup().addTo(map));

  transitPlaces.forEach(p => {
    const info = transitTypes[p.kind];
    const marker = L.marker([p.lat, p.lon], { icon: makeCircleIcon(info.color, info.emoji, 20) });
    const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lon}`;
    marker.bindPopup(
      `<div class="popup-body">` +
      `<div class="popup-day" style="color:${info.color}">${info.emoji} ${info.label}</div>` +
      `<div class="popup-name">${p.name}</div>` +
      `<div class="popup-note">${p.note}</div>` +
      `<a class="sv-link" href="${streetViewUrl}" target="_blank" rel="noopener">📷 Open in Street View ↗</a>` +
      `</div>`,
      { maxWidth: 260 }
    );
    marker.addTo(transitLayers[p.kind]);
  });

  // Filter buttons
  const filtersEl = document.getElementById('filters');
  const activeDays = new Set(Object.keys(days).map(Number));

  Object.entries(days).forEach(([d, info]) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.innerHTML = `<span class="dot" style="background:${info.color}"></span>${info.label}`;
    btn.addEventListener('click', () => {
      const dayNum = Number(d);
      if (activeDays.has(dayNum)) {
        activeDays.delete(dayNum);
        map.removeLayer(dayLayers[d]);
        btn.classList.add('off');
      } else {
        activeDays.add(dayNum);
        map.addLayer(dayLayers[d]);
        btn.classList.remove('off');
      }
    });
    filtersEl.appendChild(btn);
  });

  const activeTransit = new Set(Object.keys(transitTypes));

  Object.entries(transitTypes).forEach(([k, info]) => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.innerHTML = `<span class="dot" style="background:${info.color}">${info.emoji}</span>${info.label}`;
    btn.addEventListener('click', () => {
      if (activeTransit.has(k)) {
        activeTransit.delete(k);
        map.removeLayer(transitLayers[k]);
        btn.classList.add('off');
      } else {
        activeTransit.add(k);
        map.addLayer(transitLayers[k]);
        btn.classList.remove('off');
      }
    });
    filtersEl.appendChild(btn);
  });

  // Fit bounds to all markers initially
  const allLatLngs = places.map(p => [p.lat, p.lon]);
  map.fitBounds(allLatLngs, { padding: [30,30] });
</script>
</body>
</html>
